name: Installer and client checks
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Verify public archive installation on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./install/install.ps1 -InstallHome "$env:RUNNER_TEMP/voloirex-download-smoke"
      - name: Verify public archive installation on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: VOLOIREX_HOME="$RUNNER_TEMP/voloirex-download-smoke" bash install/install.sh
